name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Prod deploys are gated on THIS workflow by sha, not by trigger. deploy.yml is
# `workflow_dispatch` (fleet-wide since 2026-09-01) and its "Verify CI is green
# for this commit" step reads this workflow's conclusion for the exact commit
# being shipped; the devbox path (`deploy-local <app> prod`) runs the same check
# itself. A red or missing run here refuses the prod rollout by either route
# (`skip_ci_check` / `--skip-ci-check` override, loudly).
# feedback_deploy_does_not_gate_on_ci.

jobs:
  # ── Build-secret guard ───────────────────────────────────────────────────
  # Fails the build if a credential can reach a shipped image, via any of:
  #   ENV FOO_TOKEN=...     persists into the final image config
  #   ARG FOO_TOKEN         recorded in `docker history`
  #   --build-arg FOO_TOKEN=...   the workflow side of the same leak
  # On 2026-09-06 all 9 fleet repos were found publishing a live GitHub
  # Packages token (7 of them a Sentry token too) in their ECR images by
  # exactly those routes. Fixing them was a one-time cleanup; this job is what
  # turns it into an invariant. Pure grep — no Node, no install, seconds.
  # Invoked via `bash` so it does not depend on the exec bit surviving the mint.
  build-secrets:
    name: Build-secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No credentials in ENV / ARG / --build-arg
        run: bash scripts/check-build-secrets.sh

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      # NODE_AUTH_TOKEN must be on the TEST job too, not only deploy — a private
      # @matthewdbaldwin/* dep in package.json 401s `npm ci` here otherwise.
      # feedback_private_gh_packages_dep_needs_token_in_ci_test_job. The repo must
      # also be GRANTED Manage-Actions(Read) on each package.
      # feedback_new_private_package_ci_access.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Prisma 7 does NOT generate the client on install, so jest can't resolve
      # `.prisma/client/default` and every suite in the app's require graph errors
      # at load. The Dockerfile runs the same step before startup; CI must too.
      - run: npx prisma generate
      # Rate limiters skip ONLY when CI=true. feedback_rate_limiter_dev_skip.
      - run: CI=true npm test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      # Component tests (vitest + jsdom). Runs BEFORE build so a behavioral
      # regression fails fast rather than after a full Next compile.
      - run: npm test
      - run: npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pre-auth front-door smoke (Playwright, chromium). WEB-ONLY: boots the dev
  # server via the playwright webServer and drives client-side render + form
  # interactivity — no API, so no backend flakiness. Gating, like the rest of
  # CI — a login regression should block the prod rollout, which is the point.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=html
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Help Library content-coverage gate (scripts/help-audit.js). Read-only
  # static analyzer — reports blockers/warnings/nits across page/HelpButton
  # coverage and the helpContent i18n schema. Plain Node (fs/path only, no
  # deps) so no `npm ci` is needed, matching opsport/EngagePort's job shape.
  # Confirmed 0/0/0 against the scaffold's own content as of this task.
  help-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run help:audit

  # Help Library media gate (scripts/help-media-audit.js). Pairs every
  # `kind: 'media'` block in help content with a real file under
  # web/public/help-media/ — a renamed clip or bad path otherwise only fails
  # in the browser. Deliberately its own script/job, not a check inside
  # help-audit.js — see that script's own header for why. Confirmed 0/0/0
  # against the scaffold's own content as of this task.
  help-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run help:media:audit
