name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Deploy is GATED on this workflow: deploy.yml triggers on `workflow_run` of "CI"
# and only proceeds when conclusion == 'success', so a red CI blocks the prod ECS
# rollout. feedback_deploy_does_not_gate_on_ci.

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      # NODE_AUTH_TOKEN must be on the TEST job too, not only deploy — a private
      # @matthewdbaldwin/* dep in package.json 401s `npm ci` here otherwise.
      # feedback_private_gh_packages_dep_needs_token_in_ci_test_job. The repo must
      # also be GRANTED Manage-Actions(Read) on each package.
      # feedback_new_private_package_ci_access.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Prisma 7 does NOT generate the client on install, so jest can't resolve
      # `.prisma/client/default` and every suite in the app's require graph errors
      # at load. The Dockerfile runs the same step before startup; CI must too.
      - run: npx prisma generate
      # Rate limiters skip ONLY when CI=true. feedback_rate_limiter_dev_skip.
      - run: CI=true npm test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      # Component tests (vitest + jsdom). Runs BEFORE build so a behavioral
      # regression fails fast rather than after a full Next compile.
      - run: npm test
      - run: npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pre-auth front-door smoke (Playwright, chromium). WEB-ONLY: boots the dev
  # server via the playwright webServer and drives client-side render + form
  # interactivity — no API, so no backend flakiness. Gating, like the rest of
  # CI — a login regression should block the prod rollout, which is the point.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=html
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
